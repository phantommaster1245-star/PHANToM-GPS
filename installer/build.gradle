plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.phantom.gps.installer'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.phantom.gps.installer"
        minSdk 27
        targetSdk 34
        versionCode 4
        versionName "2.0.1"
        testInstrumentationRunner "io.github.phantom.gps.installer.test.AdminTestRunner"

        buildConfigField "String", "FIREBASE_API_KEY", "\"AIzaSyDT0JdPIXR9LolsMQkpJ-t2t6sn4cmr4MY\""
        buildConfigField "String", "FIREBASE_APP_ID", "\"1:140329128209:android:c18d6cd02d0525449cbcb0\""
        buildConfigField "String", "FIREBASE_PROJECT_ID", "\"phantom-gps\""
        buildConfigField "String", "TARGET_APP_PACKAGE", "\"io.github.phantom.gps\""
        buildConfigField "String", "GITHUB_RELEASES_API_BASE", "\"https://api.github.com/repos/phantommaster1245-star/PHANToM-GPS/\""
        buildConfigField "String", "GITHUB_RELEASES_PAGE", "\"https://github.com/phantommaster1245-star/PHANToM-GPS/releases\""
        buildConfigField "String", "TEMP_ACTIVATION_API_BASE", "\"https://asia-southeast1-phantom-gps.cloudfunctions.net/\""
    }

    signingConfigs {
        release {
            def keystorePropertiesFile = rootProject.file("local.properties")
            if (keystorePropertiesFile.exists()) {
                def keystoreProperties = new Properties()
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                def storeFilePath = keystoreProperties['storeFile']
                if (storeFilePath) {
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                    storeFile file(storeFilePath)
                    storePassword keystoreProperties['storePassword']
                }
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release.storeFile ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    implementation platform('com.google.firebase:firebase-bom:34.9.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-functions'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
}
