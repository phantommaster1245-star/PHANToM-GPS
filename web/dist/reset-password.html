<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ตั้งรหัสผ่านใหม่ | GeoX</title>
  <link rel="icon" href="assets/geox-icon.png">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/member.css">
  <script type="module" src="assets/password-recovery.mjs"></script>
</head>
<body class="canvas" data-design="b">
  <main class="member-wrap">
    <section class="member-card" style="max-width:480px;margin:32px auto">
      <img src="assets/geox-icon.png" alt="GeoX" width="56" height="56">
      <h1>ตั้งรหัสผ่าน GeoX ใหม่</h1>
      <p>ใช้บัญชี Google เดียวกับที่สมัคร GeoX</p>
      <button id="google" type="button" disabled>ดำเนินการต่อด้วย Google</button>
      <form id="password-form" hidden>
        <dl><dt>ชื่อผู้ใช้ GeoX</dt><dd id="username"></dd><dt>Gmail</dt><dd id="email"></dd></dl>
        <label for="password">รหัสผ่านใหม่</label>
        <input id="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
        <label for="confirm-password">ยืนยันรหัสผ่านใหม่</label>
        <input id="confirm-password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required>
        <small>ใช้รหัสผ่านอย่างน้อย 6 ตัวอักษร</small>
        <button type="submit">บันทึกรหัสผ่านใหม่</button>
      </form>
      <p id="message" class="member-message" role="status" aria-live="polite"></p>
      <a href="./">กลับหน้าแรก</a>
    </section>
  </main>
</body>
</html>
